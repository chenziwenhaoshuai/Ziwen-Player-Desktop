[package]
name = "ziwen-player"
version = "1.0.22"
description = "Ziwen Player Windows desktop (Tauri)"
authors = ["Ziwen Chen"]
edition = "2021"

[lib]
name = "ziwen_player_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
regex = "1"
once_cell = "1"
base64 = "0.22"
hmac = "0.12"
sha2 = "0.10"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
cipher = "0.4"
subtle = "2"
tiny_http = "0.12"
sha1 = "0.10"
open = "5"
url = "2"

[profile.release]
strip = true
opt-level = "s"
panic = "abort"
