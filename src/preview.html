<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      overflow: hidden;
    }
    .boundary {
      position: fixed;
      inset: 0;
      border: 3px dashed rgba(247, 200, 67, 0.95);
      box-sizing: border-box;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div class="boundary"></div>
</body>
</html>
